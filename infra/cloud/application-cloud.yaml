server:
  address: 0.0.0.0
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: jchatmind
  datasource:
    url: jdbc:postgresql://postgres:5432/jchatmind
    username: jchatmind
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 5
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
    zhipuai:
      api-key: ${ZHIPUAI_API_KEY:unused-cloud-demo}
      base-url: ${ZHIPUAI_BASE_URL:https://open.bigmodel.cn/api/paas}
      chat:
        options:
          model: ${ZHIPUAI_MODEL:glm-4.6}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:disabled}
    password: ${SMTP_PASSWORD:disabled}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
            required: ${SMTP_STARTTLS_REQUIRED:true}
          ssl:
            enable: ${SMTP_SSL_ENABLE:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
ollama:
  base-url: http://ollama:11434
mybatis:
  type-aliases-package: com.kama.jchatmind.model.entity
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.kama.jchatmind.typehandler
document:
  storage:
    base-path: /app/data/documents
