name: jchatmind-local
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jchatmind
      POSTGRES_DB: jchatmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jchatmind -d jchatmind"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
